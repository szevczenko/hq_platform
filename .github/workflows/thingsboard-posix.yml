name: ThingsBoard POSIX Functional

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  broker-functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-hq

      - name: Install integration test dependencies
        run: sudo apt-get install -y curl openssl

      - name: Configure POSIX build
        run: |
          cmake -B build_posix \
            -DHQ_DEFCONFIG=defconfig/posix.defconfig \
            -DHQ_BUILD_EXAMPLES=ON \
            -DHQ_BUILD_TESTS=ON

      - name: Build integration targets
        run: |
          cmake --build build_posix \
            --target mqtt_functional_tests tb_reconnect_integration_tests tb_tls_integration_tests \
            --parallel

      - name: Run broker-backed functional validation
        env:
          TASK529_BROKER_IMAGE: eclipse-mosquitto:2
        run: |
          bash scripts/validate_broker_integration_tests.sh "$GITHUB_WORKSPACE/build_posix"

      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thingsboard-posix-functional-artifacts
          path: |
            build_posix
            cert/tls_it
            scripts/output
